services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: laravel-app
    restart: always
    ports:
      - "${APP_PORT:-8000}:9000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ecommerce
      - DB_USERNAME=laravel_user
      - DB_PASSWORD=secure_password_here
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    volumes:
      - ./storage:/var/www/storage
    depends_on:
      - db
      - redis
    networks:
      - laravel-network

  # Nginx Web Server
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: laravel-nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./storage/app/public:/var/www/public:ro
    depends_on:
      - app
    networks:
      - laravel-network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: laravel-db
    restart: always
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      - MYSQL_DATABASE=ecommerce
      - MYSQL_USER=laravel_user
      - MYSQL_PASSWORD=secure_password_here
      - MYSQL_ROOT_PASSWORD=root_password_here
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - laravel-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: laravel-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - laravel-network

  # Horizon (Queue Worker)
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: laravel-horizon
    restart: always
    command: php artisan horizon
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ecommerce
      - DB_USERNAME=laravel_user
      - DB_PASSWORD=secure_password_here
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    depends_on:
      - db
      - redis
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge

volumes:
  mysql-data:
  redis-data: