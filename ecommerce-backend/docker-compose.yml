services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: laravel-app
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ecommerce
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - DB_ROOT_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
      - ./docker/php/custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
      - ./docker/php/fpm-pool.conf:/usr/local/etc/php-fpm.d/zzz-custom-pool.conf:ro
    extra_hosts:
      - "db:172.28.0.2"
      - "redis:172.28.0.3"
    depends_on:
      - db
      - redis
    networks:
      laravel-network:
        ipv4_address: 172.28.0.4

  # Nginx Web Server
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "0.0.0.0:8000:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./storage/app/public:/var/www/storage/app/public:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "laravel-app:172.28.0.4"
    depends_on:
      - app
    networks:
      laravel-network:
        ipv4_address: 172.28.0.5

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: laravel-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --innodb_flush_log_at_trx_commit=2 --sync_binlog=0 --innodb_buffer_pool_size=256M
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=ecommerce
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      laravel-network:
        ipv4_address: 172.28.0.2

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: laravel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      laravel-network:
        ipv4_address: 172.28.0.3

  # Horizon (Queue Worker)
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: laravel-horizon
    restart: unless-stopped
    command: php artisan horizon
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ecommerce
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    extra_hosts:
      - "db:172.28.0.2"
      - "redis:172.28.0.3"
    depends_on:
      - db
      - redis
    networks:
      laravel-network:
        ipv4_address: 172.28.0.6

networks:
  laravel-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

volumes:
  mysql-data:
  redis-data:
